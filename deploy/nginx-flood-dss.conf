# Nginx site for the Laravel dashboard. setup.sh fills in __DOMAIN__, __WEB__ and __PHPV__;
# certbot then adds HTTPS (port 443) and redirects http to https.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root __WEB__/public;
    index index.php;
    charset utf-8;
    client_max_body_size 4m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/json application/geo+json text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php__PHPV__-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # A new storm can take ~5-25 s on the model server; Laravel waits up to 120 s
        fastcgi_read_timeout 150;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve hidden files such as .env (except Let's Encrypt's .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
